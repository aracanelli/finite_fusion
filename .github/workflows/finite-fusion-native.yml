name: Finite Fusion native prototype

on:
  push:
    branches:
      - feature/fusion-native-prototype
  pull_request:
    paths:
      - 'src/finite_fusion*'
      - 'include/finite_fusion*'
      - 'src/pokemon.c'
      - 'src/pokemon_storage_system.c'
      - 'src/debug.c'
      - 'include/pokemon.h'
      - 'include/pokemon_storage_system.h'
      - 'include/config/finite_fusion.h'
      - 'Makefile'
      - '.github/workflows/finite-fusion-native.yml'

permissions:
  contents: read

jobs:
  native-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Build Emerald with saved debug sandbox
        run: make FF_NATIVE_DEBUG=1 -j2 -O all
      - name: Report native structure sizes from ELF symbol table
        run: arm-none-eabi-nm -S pokeemerald-fusion.elf | grep gPokemonStorage
